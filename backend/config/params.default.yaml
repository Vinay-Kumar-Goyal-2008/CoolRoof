# =============================================================================
# CoolRoof parameter registry (Build Spec v0.3 §11)
#
# Every number the code uses that is not data or policy lives here, with its
# evidence status. Code never hard-codes these values (rule 1).
#
#   status: V       verified against a source (spec Appendix A)
#           R       recalled; check the primary doc before relying on it
#           NV      needs verification — value is null until verified
#           ASSUME  modelling assumption: a typical, labelled default that a
#                   reviewer is expected to confirm or change
#
# value: null means "not set". Modules turn a null parameter into an
# "unavailable" output — they never guess (rule 2).
#
# Scenario parameters hold {low, base, high} ordered by VALUE (low ≤ base ≤ high).
# Modules map them to outcome scenarios explicitly (e.g. the low-yield scenario
# uses the high loss value).
#
# added_by_implementation: true marks parameters the spec does not list in §11
# but which the build needed to avoid hidden constants. All are listed in
# docs/GAPS.md for review.
# =============================================================================
parameters:

  # ---------------------------------------------------------------- M3+4 / M5
  P-SEASON:
    value: {start_mmdd: "03-01", end_mmdd: "06-15", years: 3}
    status: ASSUME
    source: "Spec M3+4 default hot-season window (Mar 1–Jun 15, years N, N-1, N-2)"
    modules: [M3+4]
  P-MAXCLOUD:
    value: 40
    unit: "% scene cloud cover"
    status: ASSUME
    source: "Spec M3+4: max scene cloud ≤40 % (scene filter only)"
    modules: [M3+4]
  P-STQA:
    value: 3.0
    unit: K
    status: ASSUME
    source: "Typical Landsat C2 ST_QA uncertainty cut-off; confirm against USGS C2 L2 guide (Appendix B item 3)"
    modules: [M3+4]
  P-MINOBS:
    value: 3
    unit: "valid observations per pixel"
    status: ASSUME
    source: "Typical minimum for a seasonal median"
    modules: [M3+4, M5]
  P-MODIS-RHO:
    value: 0.6
    unit: "Spearman rho"
    status: ASSUME
    source: "Acceptance floor for ward-rank agreement with MODIS LST"
    modules: [M5]
  P-LST-RANGE:
    value: {min_c: 0.0, max_c: 75.0}
    unit: "°C"
    status: ASSUME
    source: "Plausible land-surface temperature range for Indian hot-season scenes"
    modules: [M5]
    added_by_implementation: true

