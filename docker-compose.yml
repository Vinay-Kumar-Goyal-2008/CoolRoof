# Local stack in containers (the Windows-native path, `uv run poe dev`, needs no Docker).
services:
  api:
    build: { context: backend, dockerfile: Dockerfile.lambda }
    environment: { RUNTIME: local, CITY: mini_city }
    ports: ["8000:8080"]
  web:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm ci && npm run build && npm start"
    environment: { BACKEND_URL: "http://api:8080" }
    ports: ["3000:3000"]
    depends_on: [api]
